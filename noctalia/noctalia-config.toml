[dock]
enabled = true
launcher_icon = "rocket"
launcher_position = "start"
monitors = [ "DP-6" ]
show_dots = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-6", "lockscreen-login-box@DP-5" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-5"]
    box_height = 0.0
    box_width = 0.0
    cx = 1280.0
    cy = 1317.0
    output = "DP-5"
    rotation = 0.0
    type = "login_box"

    [lockscreen_widgets.widget."lockscreen-login-box@DP-6"]
    box_height = 0.0
    box_width = 0.0
    cx = 1280.0
    cy = 1317.0
    output = "DP-6"
    rotation = 0.0
    type = "login_box"

[shell]
font_family = "Noto Sans"
settings_show_advanced = true

    [shell.panel]
    transparency_mode = "glass"

[theme]
builtin = "Eldritch"
community_palette = "Tokyo Night Moon"

    [theme.templates]
    builtin_ids = [ "alacritty", "btop", "gtk3", "gtk4", "kitty", "labwc", "qt" ]
    community_ids = [ "vscode", "discord", "papirus-icons", "steam" ]
