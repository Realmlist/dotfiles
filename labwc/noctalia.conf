# window border
window.active.border.color: #61afef
window.inactive.border.color: #c678dd

# ToggleKeybinds status indicator
window.active.indicator.toggled-keybind.color: #e06c75

# window titlebar background
window.active.title.bg.color: #61afef
window.inactive.title.bg.color: #c678dd

window.active.label.text.color: #1e2127
window.inactive.label.text.color: #1e2127
window.label.text.justify: center

# window button hover overlay
window.button.hover.bg.color: #313640

# window buttons
window.active.button.unpressed.image.color: #1e2127
window.inactive.button.unpressed.image.color: #1e2127

# menu
menu.border.color: #1e2127
menu.items.bg.color: #61afef
menu.items.text.color: #1e2127
menu.items.active.bg.color: #c678dd
menu.items.active.text.color: #1e2127
menu.separator.color: #1e2127
menu.title.bg.color: #61afef
menu.title.text.color: #1e2127

# on screen display (window-cycle dialog)
osd.bg.color: #61afef
osd.border.color: #1e2127
osd.label.text.color: #1e2127
osd.window-switcher.preview.border.color: #616b7f
